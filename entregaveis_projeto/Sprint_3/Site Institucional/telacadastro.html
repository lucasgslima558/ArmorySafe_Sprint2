<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - ArmorySafe</title>
    <link rel="stylesheet" href="stylecadastro.css">
</head>

<body>
    <!-- header -->
    <div id="header">
        <a href="">
            <div id="logo"><img src="img/logo armory white 2(1).png" class="logoheader" alt="logo ArmorySafe"
                    width="100rem"></div>
        </a>
        <h1>ArmorySafe</h1>
        <div id="menu">
            <a class="botoes-redirecionamento botao-home" href="index.html">Home</a>
            <a class="botoes-redirecionamento botao-login" href="telalogin.html">Login</a>
        </div>
    </div>
    <!--miolo contendo imagens-->
    <div id="arealogin">

        <div id="elipse">
            <img src="img/Ellipse 22.png" class="imagem circulo-topo" alt="circulo verde" width="350px">
        </div>
        <div id="circuloBaixo">
            <img src="img/Polygon 2.png" class="imagem traingulo-baixo" alt="triangulo verde" width="350px">
        </div>
        <div id="trianguloMeio">
            <img src="img/Polygon 3.png" class="imagem triangulo-meio" alt="triangulo verde" width="500px">
            <label id="faca-login">Entre em nossa</label>
            <label id="plataforma">Plataforma!</label>
        </div>

        <!-- começo retangulo login -->
        <div class="regular-login">
            <div id="bloco-login">
                <label id="bem-vindo"><i>Bem-vindo ao CADASTRO</i></label>
                <label id="preencher">Preencha os dados abaixo para se cadastrar</label>
                <div class="campo">
                    <label id="nome">Nome Completo:</label>
                    <input id="iptNome" placeholder="Digite aqui o seu Nome">
                    <div id="msgNome"></div>
                </div>
                <div class="campo">
                    <label id="email">E-Mail:</label>
                    <input id="iptEmail" placeholder="Digite aqui o seu E-mail">
                    <div id="msgEmail"></div>
                </div>
                <div class="campo">
                    <label id="cim">CIM (apenas números):</label>
                    <input type="text" id="iptCim" placeholder="Digite aqui o seu CIM" min="0">
                    <div id="msgCim"></div>
                </div>
                <div class="campo">
                    <label id="cargoM">Cargo Militar:</label>
                    <select name="selectCargo" id="sltCargo">
                        <option value="#">Selecione</option>
                        <option value="Soldado">Soldado</option>
                        <option value="Cabo">Cabo</option>
                        <option value="Sargento">Sargento</option>
                        <option value="Tenente">Tenente</option>
                        <option value="Capitao">Capitão</option>
                        <option value="Major">Major</option>
                        <option value="Tenente-Coronel">Tenente-Coronel</option>
                        <option value="General">General</option>
                    </select>
                    <div id="msgCargo"></div>
                </div>
                <div class="campo">
                    <label id="orgM">Organização Militar:</label>
                    <input type="text" id="iptOrgM" placeholder="Digite aqui a sua Org. Militar">
                    <div id="msgOrg"></div>
                </div>
                <div class="campo">
                    <label id="municipio">Município:</label>
                    <input type="text" id="iptMunicipio" placeholder="Digite aqui o Município da Org.">
                    <div id="msgMunic"></div>
                </div>
                <div class="campo">
                    <label id="senha">Senha:</label>
                    <input type="password" id="iptSenha" placeholder="******">
                    <div id="msgSenha"></div>
                </div>
                <div class="campo">
                    <label id="confSenha">Confirme a Senha:</label>
                    <input type="password" id="iptConfSenha" placeholder="******">
                    <div id="msgConf"></div>
                </div>

                <button onclick="cadastrar()">Cadastrar</button>
            </div>
        </div>
    </div>

    <!-- footer -->
    <div id="footer">
        <div id="logoinfo">
            <img src="img/logo armory white 2(1).png" class="logofooter" alt="logo ArmorySafe" width="200px">
            <p>Sistema de monitoramento IoT que garante a segurança e preservação das munições em depósitos
                militares</p>
        </div>
        <div id="contatos">
            <h3>Contatos</h3>
            <div id="contatosFilhos">

            </div>
        </div>
    </div>
</body>
<script>
    function cadastrar() {
        let nome = iptNome.value;
        let email = iptEmail.value;
        let cim = Number(iptCim.value);
        let cargoMiliar = sltCargo.value;
        let orgMilitar = iptOrgM.value;
        let municipio = iptMunicipio.value
        let senha = iptSenha.value;
        let confirmSenha = iptConfSenha.value;
        if (iptNome.value == '' || nome.length < 7){
            msgNome.innerHTML = `Insira o seu nome completo`
        }
        if (!email.includes('@') || !email.includes('.com')) {
            msgEmail.innerHTML = `Insira um e-mail contendo "@" e ".com"`
        } else if (email.length <= 6) {
            msgEmail.innerHTML = `E-mail muito curto`
        }
        if (iptCim.value == '') {
            msgCim.innerHTML = `Insira seu CIM`
        } else if (cim.length != 10) {
            msgCim.innerHTML = `Insira seu CIM contendo Dez dígitos`
        }
        if (sltCargo.value == '#') {
            msgCargo.innerHTML = `Selecione o seu cargo militar`
        }
        if (iptOrgM.value == '' || orgMilitar.length <= 2) {
            msgOrg.innerHTML = `Insira a sua Organização Militar`
        }
        if (iptMunicipio.value == '' || municipio.length <= 1) {
            msgMunic.innerHTML = `Insira o município onde está lotado`
        }
        if (iptSenha.value == '') {
            msgSenha.innerHTML = `Insira uma senha`
        } else if (senha.length < 5) {
            msgSenha.innerHTML = `Senha muito curta. Insira uma senha com no mínimo 6 caracteres`
        }
        if (iptConfSenha.value == '') {
            msgConf.innerHTML = `Digite novamente a senha`
        } else if (confirmSenha != senha) {
            msgConf.innerHTML = `A senha deve ser a mesma do "Confirme a Senha"`
        } else {
            dashboard.href = 'dashboard.html'
        }
    }

    let imagens = ["img/o-email 1.png", "img/telefone 1.png", "img/localizacao.png"];
    let texto = ["contato@armorysafe.com.br", "(11)99999-9999", "Rua Haddock Lobo"];

    for (index = 0; index < imagens.length; index++) {
        contatosFilhos.innerHTML += `<div> <img src="./${imagens[index]}" width="40px"> ${texto[index]}<br></div>`;
        console.log(index)
    }
</script>

</html>
