<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro | ArmorySafe</title>
    <link rel="stylesheet" href="css/cadastro.css">
</head>

<body>
    <!-- header -->
    <div id="header">
        <a href="">
            <div id="logo"><img src="./assets/imgs/logo armory white 2(1).png" class="logoheader" alt="logo ArmorySafe"
                    width="100rem"></div>
        </a>
        <h3><a id="nomeSolucao" href="index.html">ArmorySafe</a></h3>
        <div id="menu">
            <a class="botoes-redirecionamento botao-home" href="index.html">Home</a>
            <a class="botoes-redirecionamento botao-login" href="login.html">Login</a>
        </div>
    </div>

    <div id="areaCadastro">
        <div id="elipse">
            <img src="./assets/imgs/Ellipse 22.png" class="imagem circulo-topo" alt="circulo verde" width="350px">
        </div>
        <div id="circuloBaixo">
            <img src="./assets/imgs/Polygon 2.png" class="imagem traingulo-baixo" alt="triangulo verde" width="350px">
        </div>
        <div id="trianguloMeio">
            <img src="./assets/imgs/Polygon 3.png" class="imagem triangulo-meio" alt="triangulo verde" width="500px">
            <label id="faca-cadastro">Faça o Cadastro em nossa</label>
            <label id="plataforma">Plataforma!</label>
        </div>
    </div>

    <!-- cadastro -->
    <div id="blocoCadastro">
        <div id="blocoCadastroItens">
            <h1 id="bem-vindo"><i>Bem-vindo à <br> Área de CADASTRO</i></h1>
            <h1 id="preencher">Preencha os dados do cadastro</h1>

            <label for="nome">Nome</label>
            <input type="text" id="iptNome">

            <label id="cim">CIM:</label>
            <input type="text" id="iptCim">

            <label id="cargoMilitar">Cargo Militar:</label>
            <select name="selectCargo" id="sltCargo">
                <option value="#">Selecione</option>
                <option value="Soldado">Soldado</option>
                <option value="Cabo">Cabo</option>
                <option value="Sargento">Sargento</option>
                <option value="Tenente">Tenente</option>
                <option value="Capitao">Capitão</option>
                <option value="Major">Major</option>
                <option value="Tenente-Coronel">Tenente-Coronel</option>
                <option value="General">General</option>
            </select>

            
            <label id="OrganizacaoMilitar">Organização militar</label>
                <select name="fkOrganizacao_Militar" id="iptOrgMil" required>
                    <option value="">Selecione</option>
                    <option value="1">Batalhão de Suprimento</option>
                    <option value="2">Base Logística do Exército</option>
                    <option value="3">Regimento de Cavalaria</option>
                    <option value="4">Centro de Instrução de Artilharia</option>
                </select>

            <label id="senha">Senha:</label>
            <input type="password" id="iptSenha" placeholder="*****">

            <label id="confSenha">Confirme a Senha:</label>
            <input type="password" id="iptConfSenha" placeholder="******">

            <button onclick="cadastrar()">Cadastrar</button>
        </div>
    </div>

    <div id="footer">
        <div id="logoinfo">
            <img src="./assets/imgs/logo armory white 2(1).png" class="logofooter" alt="logo ArmorySafe" width="200px">
            <p>Sistema de monitoramento IoT que garante a segurança e preservação das munições</p>
        </div>

        <div id="contatos">
            <h3>Contatos</h3>
            <div id="contatosFilhos"></div>
        </div>
    </div>

</body>

<script>
    function cadastrar() {

        let nome = iptNome.value;
        let cim = iptCim.value;
        let cargoMilitar = sltCargo.value;
        let orgMilitar = iptOrgMil.value;
        let senha = iptSenha.value;
        let confirmSenha = iptConfSenha.value;

        // VALIDACOES
        if (!nome) return alert("Insira seu nome");
        if (!cim) return alert("Insira seu CIM");
        if (cargoMilitar == "#") return alert("Selecione seu cargo militar");
        if (!orgMilitar) return alert("Insira sua Organização Militar");
        if (!senha) return alert("Insira sua senha");
        if (senha !== confirmSenha) return alert("As senhas não coincidem");

        fetch("/usuarios/cadastrar", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                nome: nome,
                cim: cim,
                cargo: cargoMilitar,
                organizacao: orgMilitar,
                senha: senha
            })
        })
            .then(function (resposta) {
                if (resposta.ok) {
                    alert("Cadastro realizado com sucesso!");
                } else {
                    alert("Erro ao cadastrar");
                }
            })
            .catch(function (erro) {
                console.log("ERRO:", erro);
            });
    }

    let imagens = ["assets/imgs/o-email 1.png", "assets/imgs/telefone 1.png", "assets/imgs/localizacao.png"];
    let texto = ["contato@armorysafe.com.br", "(11)99999-9999", "Rua Haddock Lobo"];

    for (index = 0; index < imagens.length; index++) {
        contatosFilhos.innerHTML += `<div> <img src="./${imagens[index]}" width="40px"> ${texto[index]}<br></div>`;
    }
</script>

</html>
