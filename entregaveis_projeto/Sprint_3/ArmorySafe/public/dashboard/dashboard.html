<!DOCTYPE html>
<html lang="pt-br">

<head>
    <link rel="shortcut icon" href="../assets/icon/favicon2.ico" type="image/x-icon">
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArmorySafe | Relatórios</title>

    <link rel="stylesheet" href="./../css/dashboards.css">
    <script src="../js/sessao.js"></script>
    <script src="./../js/alerta.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body onload="window.idPaiol = 3; iniciarPagina()">

    <div class="barra-lateral">
        <div class="logo">
            <img src="../assets/imgs/logo armory white 2.png" alt="Logo ARMORYSAFE" width="100px">
        </div>
        <nav class="menu">
            <a href="./dashboard.html" class="menu-relatorio"><img src="../assets/imgs/icone-relatorio.png" class="icone">Relatórios</a>
            <a class="menu-suporte">Suporte</a>
            <a href="mailto:armorysafe@armorysafe.com" class="menu-contato">
                <img src="../assets/imgs/icone-contato.png" class="icone">Contato
            </a>
            <a href="telalogin.html" class="menu-sair">
                <img src="../assets/imgs/icone-sair.png" class="icone">Sair
            </a>
        </nav>
        <hr class="separador">

    </div>

    <main>
        <header>
            <h1>Relatórios</h1>
            <hr class="separador-2">
        </header>

        <div class="container-cards">
            <section class="cards">
                <div class="card">
                    <p class="descricao">Umidade máxima registrada</p>
                    <h2 id="cardMax">--</h2>
                    <p class="descricao">medida em %</p>
                </div>
                <div class="card">
                    <p class="descricao">Umidade mínima registrada</p>
                    <h2 id="cardMin">--</h2>
                </div>
                <div class="card">
                    <p class="descricao">Tempo fora do ideal</p>
                    <h2 id="cardFora">--</h2>
                </div>
                <div class="card">
                    <p class="descricao">Status do Paiol</p>
                    <h2 id="cardStatus">--</h2>
                </div>
            </section>

            <div id="graficoSuperior">
                <h4>Monitoramento de Umidade</h4>
                <canvas id="myChart1" class="graficos"></canvas>
            </div>
        </div>
    </main>
</body>
<script>
    let idPaiol = 1;
    let chartInstance = null;
    let proximaAtualizacao = null;

    function iniciarPagina() {
        idPaiol = Number(sessionStorage.ID_PAIOL) || 1;
        carregarCards();
        carregarGraficoInicial();
    }

    // CARDS (KPIs)
    function carregarCards() {
        Promise.all([
            fetch(`/dashboard/umidadeMaxima/${idPaiol}`).then(r => r.json()),
            fetch(`/dashboard/ultimasLeituras/${idPaiol}`).then(r => r.json())
        ])
            .then(([dadosMax, ultimas]) => {

                const info = (dadosMax && dadosMax[0]) ? dadosMax[0] : {};

                document.getElementById("cardMax").innerText =
                    info.umidadeMaxima != null ? info.umidadeMaxima + "%" : "--";

                document.getElementById("cardMin").innerText =
                    info.umidade_minima != null ? info.umidade_minima + "%" : "--";

                let tempoFora = 0;
                if (Array.isArray(ultimas)) {
                    ultimas.forEach(item => {
                        if (item.umidade < 35 || item.umidade > 50) tempoFora++;
                    });
                }
                document.getElementById("cardFora").innerText = tempoFora + " min";

                let status = "--";
                if (Array.isArray(ultimas) && ultimas.length > 0) {
                    let dt = new Date(ultimas[0].dtLeitura);
                    let agora = new Date();
                    let diff = (agora - dt) / 1000 / 60; // em minutos
                    status = diff < 5 ? "ATIVO" : "INATIVO";
                }
                document.getElementById("cardStatus").innerText = status;

            })
            .catch(err => console.error("Erro ao carregar KPIs:", err));
    }

    // GRÁFICO - primeira carga
    function carregarGraficoInicial() {
        fetch(`/dashboard/ultimasLeituras/${idPaiol}`)
            .then(res => res.json())
            .then(dados => {
                if (!Array.isArray(dados)) return;
                const dadosOrdenados = dados.slice().reverse();
                plotarGrafico(dadosOrdenados);
            })
            .catch(erro => console.error("Erro ao buscar últimas leituras:", erro));
    }

    // PLOTAR GRÁFICO
    function plotarGrafico(resposta) {
        const labels = resposta.map(e => e.momento_grafico);
        const valores = resposta.map(e => Number(e.umidade));

        if (chartInstance) chartInstance.destroy();

        chartInstance = new Chart(
            document.getElementById("myChart1"),
            {
                type: "line",
                data: {
                    labels: labels,
                    datasets: [{
                        label: "Umidade (%)",
                        data: valores,
                        borderColor: "rgb(75,192,192)",
                        tension: 0.1,
                        fill: false
                    }]
                },
                options: {
                    responsive: true,
                    scales: {
                        y: {
                            beginAtZero: true
                        }
                    }
                }
            }
        );

        // atualiza KPIs também (caso tenham mudado)
        carregarCards();

        proximaAtualizacao = setTimeout(atualizarGraficoTempoReal, 2000);
    }

    function atualizarGraficoTempoReal() {
        fetch(`/dashboard/umidadeAtual/${idPaiol}`, { cache: 'no-store' })
            .then(res => res.json())
            .then(resultado => {
                if (!Array.isArray(resultado) || resultado.length === 0) {
                    proximaAtualizacao = setTimeout(atualizarGraficoTempoReal, 2000);
                    return;
                }

                const dado = resultado[0];
                const momento = dado.momento_grafico || dado.dtLeitura;
                const umid = Number(dado.umidade);

                if (!chartInstance) {
                    carregarGraficoInicial();
                    return;
                }

                let labels = chartInstance.data.labels;
                let dados = chartInstance.data.datasets[0].data;

                if (momento === labels[labels.length - 1]) {
                    proximaAtualizacao = setTimeout(atualizarGraficoTempoReal, 2000);
                    return;
                }

                labels.shift();
                labels.push(momento);

                dados.shift();
                dados.push(umid);

                chartInstance.update();

                carregarCards();

                proximaAtualizacao = setTimeout(atualizarGraficoTempoReal, 2000);
            })
            .catch(err => {
                console.error("Erro ao obter última leitura:", err);
                proximaAtualizacao = setTimeout(atualizarGraficoTempoReal, 2000);
            });
    }

    window.addEventListener("load", iniciarPagina);

    if (typeof module !== "undefined") {
        module.exports = { iniciarPagina, carregarCards, carregarGraficoInicial, plotarGrafico, atualizarGraficoTempoReal };
    }

</script>

</html>
