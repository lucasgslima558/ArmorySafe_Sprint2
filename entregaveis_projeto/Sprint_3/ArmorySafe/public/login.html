<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ArmorySafe | Login</title>

    <script src="./js/sessao.js"></script>

    <link rel="stylesheet" href="./css/login.css">
</head>

<body>

    <!-- header -->
    <div id="header">
        <a href="">
            <div id="logo"><img src="assets/imgs/logo armory green.png" class="logoheader" alt="logo ArmorySafe"
                    width="100rem"></div>
        </a>
        <h1><a href="index.html">ArmorySafe</a></h1>
        <div id="menu">
            <a class="botoes-redirecionamento botao-home" href="index.html">Home</a>
            <a class="botoes-redirecionamento botao-cadastro" href="cadastro.html">Cadastro</a>
        </div>
    </div>
    <!--miolo contendo imagens-->
    <div id="arealogin">

        <div id="elipse">
            <img src="./assets/imgs/Ellipse 22.png" class="imagem circulo-topo" alt="circulo verde" width="350px">
        </div>
        <div id="circuloBaixo">
            <img src="./assets/imgs/Polygon 2.png" class="imagem traingulo-baixo" alt="triangulo verde" width="350px">
        </div>
        <div id="trianguloMeio">
            <img src="assets/imgs/Polygon 3.png" class="imagem triangulo-meio" alt="triangulo verde" width="500px">
            <label id="faca-login">Entre em nossa</label>
            <label id="plataforma">Plataforma!</label>
        </div>

        <!-- começo retangulo login -->
        <div id="bloco-login">
            <label id="bem-vindo"><i>Bem-vindo ao LOGIN</i></label><br><br>
            <label id="preencher">Preencha os dados do login para acessar</label><br><br>
            <label id="cim">CIM:</label>
            <input type="number" id="iptLogin" placeholder="Digite aqui o seu CIM" min="0">
            <div id="mensagem1"></div>
            <label id="senha">Senha:</label>
            <input type="password" id="iptSenha" placeholder="******">
            <div id="mensagem2"></div>
            <div id="div_aguardar" style="display: none;"></div> <!--Adicionar o loading-->
            <a href="#" id="recuperar">Recuperar Senha</a>

            <button onclick="entrar()">Entrar</button>

            <div id="mensagem_erro"> Preencha todos os campos</div>
        </div>
    </div>

    <!-- footer -->
    <div id="footer">
        <div id="logoinfo">
            <img src="img/logo armory white 2(1).png" class="logofooter" alt="logo ArmorySafe" width="200px">
            <p>Sistema de monitoramento IoT que garante a segurança e preservação das munições em depósitos
                militares</p>
        </div>
        <div id="contatos">
            <h3>Contatos</h3>
            <div id="contatosFilhos">

            </div>
        </div>
    </div>

</body>

</html>

<script>

    function entrar() {
        aguardar();

        var cim = iptLogin.value;
        var senha = iptSenha.value;

        if (cim == 0 || senha == "") {
            mensagem_erro.style.display = "block"
            finalizarAguardar();
            return false;
        }
        else {
            setInterval(sumirMensagem, 5000)
        }

        console.log("FORM LOGIN: ", cim);
        console.log("FORM SENHA: ", senha);

        fetch("/usuarios/autenticar", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                cim: cim,
                senha: senha
            })
        }).then(function (resposta) {
            console.log("ESTOU NO THEN DO entrar()!")

            if (resposta.ok) {
                console.log(resposta);

                resposta.json().then(json => {
                    console.log(json);
                    console.log(JSON.stringify(json));
                    sessionStorage.NOME_USUARIO = json.nome;
                    sessionStorage.ID_USUARIO = json.id;
                    sessionStorage.NIVEL_USUARIO = json.cargoUsuario
                    
                    if (json.cargoUsuario == 'usuario') {
                        setTimeout(function () {
                            window.location = "./dashboard/cards.html";
                        }, 1000); // apenas para exibir o loading
                    }else{
                        setTimeout(function () {
                            window.location = "./public/index.html";
                        },1000); // apenas para exibir o loading
                    }

                });

            } else {

                console.log("Houve um erro ao tentar realizar o login!");

                resposta.text().then(texto => {
                    console.error(texto);
                    finalizarAguardar(texto);
                });
            }

        }).catch(function (erro) {
            console.log(erro);
        })

        return false;
    }

    function sumirMensagem() {
        cardErro.style.display = "none"
    }

</script>
