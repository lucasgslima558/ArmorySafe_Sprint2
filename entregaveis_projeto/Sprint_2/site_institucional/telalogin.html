<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ArmorySafe</title>
    <link rel="stylesheet" href="stylelogin2.css">
</head>

<body>
    <div id="login" class="login">
        <div id="rectangle28" class="rectangle28">
            <div id="group1" class="group1"></div>
            <div id="textAS" class="textAS">ArmorySafe</div>
        </div>
        <div id="pexels" class="pexels">
            <div id="rectangle27" class="rectangle27"></div>
            <div id="textlogin" class="textlogin">Email ou CIR</div>
            <input id="dado_login" class="rectangle24">
            <div id="textsenha" class="textsenha">Senha</div>
            <input type="password" id="dado_senha" class="rectangle23">
            <a href="www.recsenha.armorysafe.com.br" class="rectangle25">Recuperar Senha</a>
            <button onclick="entrar()" class="entrar">Entrar</button>
        </div>
        <div id="frame2" class="frame2">
            <div id="logodown"></div>
            <div id="textfrase" class="textfrase">Sistema de monitoramento IoT que garante a segurança e preservação das munições em depósitos militares</div>
            <div id="textcontato" class="textcontato">Contato</div>
            <div id="textemailAS" class="textemailAS">contato@armorysafe.com.br</div>
            <div id="texttelAS" class="texttelAS">(11) 99999-9999</div>
            <div id="textlocal" class="textlocal">São Paulo - SP, Brasil</div>
        </div>
    </div>
</body>
<script>
    function entrar() {
        var login = dado_login.value;
        var senha = dado_senha.value;
        if (dado_login.value == '' && dado_senha.value == '') {
            alert('Insira dados nos campos "Login" e "Senha"')
        } else {
            if (dado_login.value == '') {
                alert('Insira um login no campo "Login"')
            } else {
                if (dado_senha.value == '') {
                    alert('Insira uma senha no campo "Senha"')
                }

            }
        }
    }

</script>

</html>
