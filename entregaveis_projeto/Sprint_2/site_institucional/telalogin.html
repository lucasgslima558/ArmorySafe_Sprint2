<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ArmorySafe</title>
    <link rel="stylesheet" href="stylelogin2.css">
</head>

<body>
    <div id="header">
        <img src="img/logo armory white 2(1).png" class="logocima" alt="logocima">
        <div id="rectangle28">
            <div id="textoAS" class="textoAS">ArmorySafe</div>
        </div>
        <div id="login" class="siteLogin">
        </div>
        <!-- <img src="img/imagemMunicao.jpg" class="fundo" alt="fundo"> -->
        <div id="containerLogin" class="containerLogin"></div>
        <div id="login" class="login">Email ou CIR:</div>
        <input id="dado_login" class="insertLogin">
        <div id="senha" class="senha">Senha:</div>
        <input type="password" id="dado_senha" class="insertSenha">
        <a href="www.recsenha.armorysafe.com.br" class="recSenha">Recuperar Senha</a>
        <button onclick="entrar()" class="entrar">Entrar</button>
    </div>
    <div id="infoComplementar" class="infoComplementar">
        <img src="img/logo armory white 2(1).png" class="logodown" alt="logodown">
        <div id="logodown"></div>
        <div id="dado_frase" class="frase">Sistema de monitoramento IoT que garante a segurança e preservação das
            munições em depósitos militares</div>
        <div id="contato" class="contato">Contato</div>
        <div id="dado_emailAS" class="emailAS">contato@armorysafe.com.br</div>
        <div id="dado_TelAS" class="telAS">(11) 99999-9999</div>
        <div id="dado_local" class="local">São Paulo - SP, Brasil</div>
    </div>
    </div>
</body>
<script>
    function entrar() {
        var login = dado_login.value;
        var senha = dado_senha.value;
        if (dado_login.value == '' && dado_senha.value == '') {
            alert('Insira dados nos campos "Email ou CIR" e "Senha"')
        } else {
            if (dado_login.value == '') {
                alert('Insira um login no campo "Email ou CIR"')
            } else {
                if (dado_senha.value == '') {
                    alert('Insira uma senha no campo "Senha"')
                }
            }
        }
    }

</script>

</html>
