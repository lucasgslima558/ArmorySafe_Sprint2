<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ArmorySafe</title>
    <link rel="stylesheet" href="stylelogin.css">
</head>

<body>
    <!-- Header -->
    <div id="header">
        <div id="logo"><img src="img/logo armory white 2(1).png" class="logocima" alt="logo armorySafe" width="100px">
        </div>
        <h3>ArmorySafe</h3>
        <div id="menu">
            <a href="index.html">Home</a>
            <a href="telacadastro.html">Cadastrar-se</a>
        </div>
    </div>

    <!-- Inputs para entrada de dados para login -->
    <div id="login">
        <label>Login:</label>
        <input type="text" id="iptLogin">
        <label>Senha:</label>
        <input type="password" id="iptSenha" placeholder="*****">
        <span id="recuperar">
            <a href="#">Recuperar Senha</a>
        </span>
        <button onclick="entrar()">Entrar</button>
    </div>

    <!-- footer com informações -->
    <div id="footer">
        <div id="inform">
            <img src="img/logo armory white 2(1).png" class="logodown" alt="logo ArmorySafe" width="150px">
            <p>
                Sistema de monitoramento IoT que garante a segurança e preservação das
                munições em depósitos militares
            </p>
        </div>

        <div id="contatos">
            <h3><u>Contato</u></h3>
            <div id="contatosFilhos">

            </div>
        </div>

        <div id="demo">
            <h3>
                <u>Demonstração</u>
            </h3>
            <p>
                Solicite já uma apresentação
                personalizada da ArmorySafe
                para o seu quartel.
            </p>
            <a href="index.html">
                <button>
                    Simular
                </button>
            </a>
        </div>
    </div>

</body>
<script>
    function entrar() {
        let login = iptLogin.value;
        let senha = iptSenha.value;



        if (login === '' && senha === '') {
            alert('Insira dados nos campos "Email ou CIR" e "Senha"')
        } else if (senha === '') {
            alert('Insira uma senha no campo "Senha"')
        }
    }

    let imagens = ["img/o-email 1.png", "img/telefone 1.png", "img/localizacao.png"];
    let texto = ["contato@armorysafe.com.br", "(11)99999-9999", "Rua Haddock Lobo"];

    for (index = 0; index < imagens.length; index++) {
        contatosFilhos.innerHTML += `<div> <img src="./${imagens[index]}" width="40px"> ${texto[index]}<br></div>`;
        console.log(index)
    }

</script>

</html>
