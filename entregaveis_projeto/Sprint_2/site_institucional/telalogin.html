<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ArmorySafe</title>
    <link rel="stylesheet" href="stylelogin2.css">
</head>

<body>
    <!-- Header -->
    <div id="header">
        <div id="logo"><img src="img/logo armory white 2(1).png" class="logocima" alt="logo armorySafe" width="100px"></div>
        <p>ArmorySafe</p>
        <div id="menu">
            <a>Home</a>
            <a>Cadastrar-se</a>
        </div>
    </div>


    <div id="login" class="siteLogin">
        <div id="login" class="login">Email ou CIR:</div>
        <input id="dado_login" class="insertLogin">
        <div id="senha" class="senha">Senha:</div>
        <input type="password" id="dado_senha" class="insertSenha">
        <a href="www.recsenha.armorysafe.com.br" class="recSenha">Recuperar Senha</a>
        <button onclick="entrar()" class="entrar">Entrar</button>
    </div>


    <div id="infoComplementar">

        <div class="footer">
            <img src="img/logo armory white 2(1).png" class="logodown" alt="logodown">
        </div>
        <div class="footer">Sistema de monitoramento IoT que garante a segurança e preservação das
            munições em depósitos militares
        </div>

        <div class="footer">
            Contato
        </div>
        <div class="footer">
            contato@armorysafe.com.br
        </div>
        <div class="footer">
            (11) 99999-9999
        </div>
        <div class="footer">
            São Paulo - SP, Brasil
        </div>
    </div>

</body>
<script>
    function entrar() {
        var login = dado_login.value;
        var senha = dado_senha.value;


        if (dado_login.value == '' && dado_senha.value == '') {
            alert('Insira dados nos campos "Email ou CIR" e "Senha"')
        } else if (senha === '') {
            alert('Insira uma senha no campo "Senha"')
        }
    }

</script>

</html>
