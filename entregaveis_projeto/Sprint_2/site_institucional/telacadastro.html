<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - ArmorySafe</title>
    <link rel="stylesheet" href="stylecadastro.css">
</head>

<body>
    <!-- Header -->
    <div id="header">
        <div id="logo"><img src="img/logo armory white 2(1).png" class="logocima" alt="logo armorySafe" width="100px">
        </div>
        <h3>ArmorySafe</h3>
        <div id="menu">
            <a href="index.html">Home</a>
            <a href="telalogin.html">Login</a>
        </div>
    </div>

    <!-- Inputs para entrada de dados para cadastro -->
    <div id="cadastro">
        <label>Nome:</label>
        <input type="text" id="iptNome">
        <label>Sobrenome:</label>
        <input type="password" id="iptSobrenome">
        <label>E-mail:</label>
        <input type="text" id="iptEmail">
        <label>Gênero:</label>
        <select name="radioGen" id="sltGenero">
            <option value="#">Selecione...</option>
            <option value="Feminino">Feminino</option>
            <option value="Masculino">Masculino</option>
            <option value="Neutro">Neutro/Prefiro Não Responder</option>
        </select>
        <label>Telefone Celular:</label>
        <input type="text" id="iptTelCel">
        <label>CIR:</label>
        <input type="text" id="iptCir">
        <label>Cargo Militar:</label>
        <input type="text" id="iptCargoMil">
        <label>Organização Militar:</label>
        <input type="text" id="iptOrgMil">
        <label>Município:</label>
        <input type="text" id="iptMunic">
        <label>Senha:</label>
        <input type="password" id="iptSenha" placeholder="*****">
        <label>Confirme a Senha:</label>
        <input type="password" id="iptConfSenha" placeholder="******">
        <button onclick="cadastrar()">Cadastrar</button>
    </div>

    <!-- footer com informações -->
    <div id="footer">
        <div id="inform">
            <img src="img/logo armory white 2(1).png" class="logodown" alt="logo ArmorySafe" width="150px">
            <p>
                Sistema de monitoramento IoT que garante a segurança e preservação das
                munições em depósitos militares
            </p>
        </div>

        <div id="contatos">
            <h3>Contatos</h3>
            <div id="contatosFilhos">

            </div>
        </div>

        <div id="demo">
            <h3>Demonstração</h3>
            <p>
                Solicite já uma apresentação
                personalizada da ArmorySafe
                para o seu quartel.
            </p>
            <a href="index.html">
                <button>
                    Simular
                </button>
            </a>
        </div>
    </div>

</body>
<script>
    function cadastrar() {
        let nome = iptNome.value;
        let sobrenome = iptSobrenome.value;
        let email = iptEmail.value;
        let genero = iptGenero.value;
        let telefoneCelular = iptTelCel.value;
        let cir = iptCir.value;
        let cargoMilitar = iptCargoMil.value;
        let orgMilitar = iptOrgMil.value;
        let municipio = iptMunic.value
        let senha = iptSenha.value;
        let confirmSenha = iptConfSenha.value;
        if (iptNome.value == '' || iptSobrenome.value == '' || iptEmail.value == '' || iptTelCel.value == '' || iptCir.value == '' || iptCargoMil.value == '' || iptOrgMil.value == '' || iptMunic.value == '' || iptSenha.value == '' || iptConfSenha.value == '' || radio_sexoFem.value == '' || radio_sexoMasc.value == '') {
            alert(`Insira dados em todos os campos e escolha umas das opções (F ou M)`)
        } else {
            if (nome.length <= 2) {
                alert('Nome muito curto')
            } else {
                if (!email.includes('@') || !email.includes('.')) {
                    alert(`Insira um email contendo os símbolos "@" e "."`)
                } else {
                    if (email.length <= 6) {
                        alert(`Email muito curto`)
                    } else {
                        if (radio == '') {
                            alert('Escolha uma das opções de sexo')
                        } else {
                            if (telefoneCelular.length < 13) {
                                alert('Insira o DDD ou número digitado está curto')
                            } else {
                                if (iptCir.value == '') {
                                    alert('Insira seu CIR')
                                } else {
                                    if (iptCargoMil.value == '') {
                                        alert('Insira um cargo militar')
                                    } else {
                                        if (iptOrgMil.value == '') {
                                            alert('Insira a Organização Militar ao qual está lotado')
                                        } else {
                                            if (iptMunic.value == '') {
                                                alert('Insira o município onde está')
                                            } else {
                                                if (iptSenha.value == '') {
                                                    alert('Insira uma senha')
                                                } else {
                                                    if (senha.length < 4) {
                                                        alert('Senha muito curta. Insira uma senha com no mínimo 6 caracteres')
                                                    } else {
                                                        if (iptConfSenha.value == '') {
                                                            alert('Digite novamente a senha no "Repita a Senha"')
                                                        } else {
                                                            if (confirmSenha != senha) {
                                                                alert('A senha deve ser a mesma do "Repita a Senha"')
                                                            }

                                                        }
                                                    }
                                                }
                                            }
                                        }
                                    }
                                }
                            }
                        }
                    }
                }
            }
        }
    }
    let imagens = ["img/o-email 1.png", "img/telefone 1.png", "img/localizacao.png"];
    let texto = ["contato@armorysafe.com.br", "(11)99999-9999", "Rua Haddock Lobo"];

    for (index = 0; index < imagens.length; index++) {
        contatosFilhos.innerHTML += `<div> <img src="./${imagens[index]}" width="40px"> ${texto[index]}<br></div>`;
        console.log(index)
    }

</script>

</html>
