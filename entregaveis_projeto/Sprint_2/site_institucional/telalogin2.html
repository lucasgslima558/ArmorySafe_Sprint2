<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ArmorySafe</title>
    <link rel="stylesheet" href="stylelogin2.css">
</head>

<body>
    <!-- header -->
    <div id="header">
        <a href="">
            <div id="logo"><img src="img/logo armory white 2(1).png" class="logoheader" alt="logo ArmorySafe"
                    width="100rem"></div>
        </a>
        <h1>ArmorySafe</h1>
        <div id="menu">
            <a class="botoes-redirecionamento botao-home" href="index.html">Home</a>
            <a class="botoes-redirecionamento botao-cadastro" href="telacadastro2.html">Cadastro</a>
        </div>
    </div>
    <!--miolo contendo imagens-->
    <div id="arealogin">

        <div id="elipse">
            <img src="img/Ellipse 22.png" class="imagem circulo-topo" alt="circulo verde" width="350px">
        </div>
        <div id="circuloBaixo">
            <img src="img/Polygon 2.png" class="imagem traingulo-baixo" alt="triangulo verde" width="350px">
        </div>
        <div id="trianguloMeio">
            <img src="img/Polygon 3.png" class="imagem triangulo-meio" alt="triangulo verde" width="500px">
            <label id="faca-login">Entre em nossa</label>
            <label id="plataforma">Plataforma!</label>
        </div>

        <!-- começo retangulo login -->
        <div id="bloco-login">
            <label id="bem-vindo"><i>Bem-vindo ao LOGIN</i></label><br><br>
            <label id="preencher">Preencha os dados do login para acessar</label><br><br>
            <label id="cim">CIM:</label>
            <input type="number" id="iptLogin" placeholder="Digite aqui o seu CIM" min="0">
            <div id="mensagem1"></div>
            <label id="senha">Senha:</label>
            <input type="password" id="iptSenha" placeholder="******">
            <div id="mensagem2"></div>
            <a href="#" id="recuperar">Recuperar Senha</a>

            <button onclick="entrar()">Entrar</button>
        </div>
    </div>

    <!-- footer -->
    <div id="footer">
        <div id="logoinfo">
            <img src="img/logo armory white 2(1).png" class="logofooter" alt="logo ArmorySafe" width="200px">
            <p>Sistema de monitoramento IoT que garante a segurança e preservação das munições em depósitos
                militares</p>
        </div>
        <div id="contatos">
            <h3>Contatos</h3>
            <div id="contatosFilhos">

            </div>
        </div>
    </div>
</body>
<script>
    function entrar() {
        let login = Number(iptLogin.value);
        let senha = iptSenha.value;

        if (iptLogin.value === '' && senha === '') {
            mensagem1.innerHTML = `Insira a CIM no campo`
            mensagem2.innerHTML = `Insira a Senha no campo`
        } else if (login.length < 8 || login.length > 10 || login % 1 != 0) {
            mensagem1.innerHTML = `Insira a CIM válido no campo "CIM"`
        } else if (senha === '') {
            mensagem2.innerHTML = 'Insira uma senha no campo "Senha"'
        } else if (senha.length < 6) {
            mensagem2.innerHTML = `Insira uma senha com no mínimo 7 caracteres`
        } else {
            dashboard.href = 'dashboard.html'
        }
    }

    let imagens = ["img/o-email 1.png", "img/telefone 1.png", "img/localizacao.png"];
    let texto = ["contato@armorysafe.com.br", "(11)99999-9999", "Rua Haddock Lobo"];

    for (index = 0; index < imagens.length; index++) {
        contatosFilhos.innerHTML += `<div> <img src="./${imagens[index]}" width="40px"> ${texto[index]}<br></div>`;
        console.log(index)
    }
</script>

</html>
