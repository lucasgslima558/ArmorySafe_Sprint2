<!doctype html>
<html>
<head>
    <title>ArmorySafe - Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body {
            background: #67B36B;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            font-family: 'Inter', sans-serif;
            margin-top: 30px;
            font-size: 30px;
            font-weight: 700;
            color: white;
            padding-bottom: 15px;
            border-bottom: 3px solid black;
            margin-bottom: 20px;
            line-height: 1.1;
        }

        .card {
            margin-top: 30px;
            background: white;
            width: 80%;
            max-width: 700px;
            padding: 25px;
            border-radius: 16px;
            display: flex;
            justify-content: center;
            border: rgba(0, 0, 0, 0.1);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.5);
        }

        canvas {
            max-width: 100%;
        }
    </style>
</head>

<body>

    <h1>ArmorySafe - Umidade em Tempo Real</h1>

    <div class="card">
        <canvas id="sensorAnalogico"></canvas>
    </div>

    <script>
        var sensorAnalogico = new Chart(document.getElementById('sensorAnalogico').getContext('2d'), {
            type: 'line',
            data: {
                labels: [],
                datasets: [{
                    label: 'Dados de Umidade (%)',
                    borderColor: '#0A99C8',
                    backgroundColor: '#6BD6ED',
                    borderWidth: 2,
                    pointRadius: 3
                }]
            },
            options: {
                responsive: true,
                scales: {
                    x: { beginAtZero: true },
                    y: { beginAtZero: true, title: { display: true, text: '(%)' } }
                }
            }
        });

/*      <canvas id="sensorDigital"></canvas>
        var sensorDigital = new Chart(document.getElementById('sensorDigital').getContext('2d'), {
            type: 'line',
            data: {
                datasets: [{
                    label: 'Digital',
                    borderColor: '#63B1BC',
                    backgroundColor: '#0762C8'
                }]
            },
            options: {
                scales: {
                    x: {
                        beginAtZero: true
                    },
                    y: {
                        title: {
                            display: true,
                            text: '(0-1)'
                        },
                        beginAtZero: true
                    }
                }
            }
        }); */

        var paginacao = {};
        var tempo = {};

        function obterDados(grafico, endpoint) {
            fetch('http://localhost:3300/sensores/' + endpoint)
                .then(response => response.json())
                .then(valores => {
                    if (paginacao[endpoint] == null) {
                        paginacao[endpoint] = 0;
                    }
                    if (tempo[endpoint] == null) {
                        tempo[endpoint] = 0;
                    }

                    var ultimaPaginacao = paginacao[endpoint];
                    paginacao[endpoint] = valores.length;
                    valores = valores.slice(ultimaPaginacao);

                    valores.forEach((valor) => {
                        if (grafico.data.labels.length == 10 && grafico.data.datasets[0].data.length == 10) {
                            grafico.data.labels.shift();
                            grafico.data.datasets[0].data.shift();
                        }

                        grafico.data.labels.push(tempo[endpoint]++);
                        grafico.data.datasets[0].data.push(parseFloat(valor));
                        grafico.update();
                    });
                })
                .catch(error => console.error('Erro ao obter dados:', error));
        }

        setInterval(() => {
            obterDados(sensorAnalogico, 'analogico');
           /* obterDados(sensorDigital, 'digital');*/
        }, 1000);

    </script>
</body>

</html>
